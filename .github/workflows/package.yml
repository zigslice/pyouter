# Build two packages and, on main, publish a GitHub Release.
# The release tag is v<version> from setup.py. The same version updates
# that release's files. A new version in setup.py publishes the next one.
# This does not publish to PyPI. That needs a token or trusted publishing.

name: Package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Python package
        run: |
          python -m pip install build
          python -m build

      - name: Pack the skills
        run: python scripts/pack_skills.py

      - name: Stage the two packages
        run: |
          mkdir -p packages/python packages/skills
          cp dist/*.whl dist/*.tar.gz packages/python/
          cp dist/pyouter-skills-*.zip packages/skills/
          test -n "$(ls packages/python)"
          test -n "$(ls packages/skills)"

      - uses: actions/upload-artifact@v4
        with:
          name: pyouter-python
          path: packages/python/

      - uses: actions/upload-artifact@v4
        with:
          name: pyouter-skills
          path: packages/skills/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pyouter-*
          path: release
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(echo release/pyouter-skills-*.zip)
          version=$(basename "$archive" .zip)
          version=${version#pyouter-skills-}
          tag="v${version}"
          notes="Python package and skills package for ${tag}. This release does not publish to PyPI."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes"
          fi
