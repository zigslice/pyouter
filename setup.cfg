[aliases]
release = register sdist bdist_egg upload

[options]
package_dir =
    =src
packages = find_namespace:
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
pyouter =
    webui/*
    webui/**/*

[options.entry_points]
console_scripts = pyouter = pyouter:runner